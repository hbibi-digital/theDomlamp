# Build environments for the Dom tower lamp: stock WLED 16.0.1 plus the "domlamp" usermod.
# Copied into the WLED checkout by build.sh (as platformio_override.ini); see README.md.
# No secrets here: the wifi is set up in WLED's own access point after flashing.

[platformio]
default_envs = domlamp_esp32

[domlamp]
build_flags =
  -D WLED_NTP_ENABLED=true          ; the lamp follows a plan by the clock
  -D WLED_TIMEZONE=2                ; TZ_EUROPE_CENTRAL
  -D LED_TYPES=TYPE_SK6812_RGBW
  -D PIXEL_COUNTS=52
  -D SERVERNAME='"theDomlamp"'
  -D WLED_BRAND='"theDomlamp"'         ; shown on the info page; also the name of the setup network
  -D WLED_PRODUCT_NAME='"Domtoren"'
  -D WLED_AP_SSID_UNIQUE            ; setup network "theDomlamp-<last six of the MAC>": two new lamps do not collide
  -D MDNS_NAME='"thedomlamp"'       ; http://thedomlamp.local

# Generic ESP32 (4 MB). audioreactive stays in, as in WLED's own ESP32 build.
[env:domlamp_esp32]
extends = env:esp32dev
custom_usermods = audioreactive domlamp
; current limit for the strip: a controller built for it (5 V / 3 A supply, own fuse)
build_flags = ${env:esp32dev.build_flags} ${domlamp.build_flags} -D ABL_MILLIAMPS_DEFAULT=2500
; LED data pin: WLED's default (GPIO 16); change it in WLED's LED settings or add -D DATA_PINS=<gpio> here

# ESP32-C3: the Seeed Studio XIAO ESP32-C3 of the two trial lamps, LED data on GPIO 10 (its pin D10).
[env:domlamp_esp32c3]
extends = env:esp32c3dev
custom_usermods = audioreactive domlamp
; current limit for the strip: on the XIAO all of it runs through the board's own USB connector and
; 5 V trace. 52 SK6812 RGBW pixels draw about 1.0 A in warm white and 1.9 A in orange (20 mA a channel);
; 2 A leaves those as they are and dims only what asks for more (27 Nov 2026; not measured on a board)
build_flags = ${env:esp32c3dev.build_flags} ${domlamp.build_flags} -D ABL_MILLIAMPS_DEFAULT=2000
  -D DATA_PINS=10
